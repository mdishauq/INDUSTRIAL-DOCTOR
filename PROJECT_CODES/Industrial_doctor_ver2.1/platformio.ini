; PlatformIO Project Configuration File
; Industrial Doctor v1.0.1
; Board : ESP32-S3 N16R8 (16MB Flash | 8MB OPI PSRAM)
; Sensor: INMP441 (WS=GPIO13, SD=GPIO11, SCK=GPIO12)
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-n16r8
framework = arduino

; ── Custom board JSON lives in .pio/boards/ ────────────────
board_build.flash_size        = 16MB
board_build.psram_type        = opi
board_upload.flash_size       = 16MB
board_build.arduino.memory_type = qio_opi

; 16 MB partition table
board_build.partitions        = default_16MB.csv

; ── Build flags ────────────────────────────────────────────
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    -DESP32S3
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DCONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY=1
    -DCORE_DEBUG_LEVEL=0
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit SSD1306 @ ^2.5.11

; ── Upload / monitor ───────────────────────────────────────
upload_speed  = 921600
monitor_speed = 2000000

; ── Debug variant (enable with: pio run -e esp32-s3-n16r8-debug)
[env:esp32-s3-n16r8-debug]
extends     = env:esp32-s3-n16r8
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -UCORE_DEBUG_LEVEL
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_MODE=1
