[platformio]
build_dir = C:\.pio_build

[env:esp32s3_n16r8_industrial_doctor]
; =============================================================
;  ESP32-S3-WROOM-1 N16R8  —  16MB QIO Flash / 8MB OPI PSRAM
;  Industrial Doctor — Edge Impulse Audio Classifier v2.1
; =============================================================

platform  = espressif32 @ ~6.5.0
; ^^^ PINNED — espressif32 6.5.0 = Arduino-ESP32 2.0.14 = IDF 4.4.7
;     This is the most stable release for ESP32-S3 qio_opi with N16R8 hardware.
;     'platform = espressif32' (unpinned) downloads whatever version PlatformIO
;     has cached, which changes behaviour across machines and time.
framework = arduino

; --- Custom board definition (in project_root/boards/esp32s3_n16r8.json) ---
; This replaces 'esp32-s3-devkitc-1' which was hardcoded as "No PSRAM".
; PlatformIO automatically searches the 'boards/' folder in your project root.
board = esp32s3_n16r8

lib_ldf_mode  = deep+
lib_archive   = no
monitor_speed = 115200

; Note: board_build.mcu, flash_mode, psram_type, memory_type, f_cpu and
; flash_size are now declared in boards/esp32s3_n16r8.json.
; The overrides below REPEAT the critical ones explicitly — PlatformIO does not
; always propagate nested board JSON properties to esptool reliably, especially
; for custom boards. platformio.ini overrides always win.
board_build.partitions        = default_16MB.csv
board_build.flash_mode        = qio
; ^^^ CRITICAL: without this explicit override the flashed image header defaults
;     to DIO. The ROM bootloader then initialises PSRAM in the wrong SPI mode,
;     hangs inside the cache-MMU setup (Saved PC:0x403743c0), and the ROM boot
;     WDT fires before setup() is ever called. This cannot be fixed in user code.
board_build.f_flash           = 40000000l
; ^^^ 40 MHz instead of 80 MHz. The AP3248L OPI PSRAM on N16R8 requires timing
;     calibration at 80 MHz that the ROM init code does not always complete within
;     the boot WDT window. 40 MHz is stable on cold boot. Once the board boots
;     reliably you can try raising this back to 80000000l.
board_build.arduino.memory_type = qio_opi
; ^^^ Selects the pre-compiled framework variant: QIO flash + OPI PSRAM.
;     Must match flash_mode (qio) above — mismatching variants cause boot hangs.

lib_deps =
    kosme/arduinoFFT @ ^2.0.2
    adafruit/Adafruit NeoPixel @ ^1.15.4

build_flags =
    ; --- USB ---
    ; Also declared in board JSON extra_flags but safe to repeat
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; --- PSRAM ---
    ; BOARD_HAS_PSRAM is in board JSON extra_flags — this is a safety duplicate
    -DBOARD_HAS_PSRAM

    ; --- PSRAM sdkconfig overrides ---
    ; These affect our own compiled source files.
    ; The actual PSRAM init is done by the pre-compiled qio_opi framework libs.
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DCONFIG_SPIRAM_SPEED_80M=1
    -DCONFIG_SPIRAM_BOOT_INIT=1
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC=1
    -DCONFIG_SPIRAM_FETCH_INSTRUCTIONS=1
    -DCONFIG_SPIRAM_RODATA=1

    ; ⚠️  DO NOT ADD -mfix-esp32-psram-cache-issue  ⚠️
    ; ESP32 original silicon fix — actively breaks ESP32-S3 PSRAM at boot.

    ; --- Stack ---
    ; 64 KB was allocating from internal RAM during framework init BEFORE setup() ran,
    ; adding ~1-2 s to framework startup time and pushing total time past the 5 s WDT.
    ; 32 KB is sufficient for Edge Impulse + WiFi + I2S on the loop task.
    -DARDUINO_LOOP_STACK_SIZE=32768

    ; --- Edge Impulse ---
    -DEI_CLASSIFIER_ALLOCATION_STATIC=0
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0

    ; --- Edge Impulse include paths ---
    -Ilib/industrial_doctor_inferencing/src
    -Ilib/industrial_doctor_inferencing/src/edge-impulse-sdk
    -Ilib/industrial_doctor_inferencing/src/model-parameters
    -Ilib/industrial_doctor_inferencing/src/tflite-model
    -Ilib/industrial_doctor_inferencing/src/edge-impulse-sdk/porting/espressif/ESP-NN/include